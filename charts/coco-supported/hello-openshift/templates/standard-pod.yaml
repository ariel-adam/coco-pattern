apiVersion: v1
kind: Pod
metadata:
  name: standard
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: standard
spec:
  runtimeClassName: {{ .Values.global.runtimeClass }}
  containers:
    - name: hello-openshift
      image: quay.io/openshift/origin-hello-openshift
      env:
        - name: GITOPS_DEMO
          value: "pushed-from-git-triggered-argocd"
      ports:
        - containerPort: 8888
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault